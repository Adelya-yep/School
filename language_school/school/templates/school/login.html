{% extends 'school/base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4">
                    <!-- Заголовок -->
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right display-6 text-primary mb-3"></i>
                        <h2 class="card-title fw-bold">Вход в аккаунт</h2>
                        <p class="text-muted">Войдите для доступа к вашим курсам</p>
                    </div>

                    <!-- Форма -->
                    <form method="post">
                        {% csrf_token %}

                        {% if form.errors %}
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            Неверное имя пользователя или пароль.
                        </div>
                        {% endif %}

                        <!-- Имя пользователя -->
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="bi bi-person me-1"></i>Имя пользователя
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-at"></i>
                                </span>
                                <input type="text" class="form-control" name="username" id="username"
                                       required placeholder="Введите имя пользователя">
                            </div>
                        </div>

                        <!-- Пароль -->
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1"></i>Пароль
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password" class="form-control" name="password" id="password"
                                       required placeholder="Введите пароль">
                            </div>
                        </div>

                        <!-- Кнопка входа -->
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                        </button>

                        <!-- Ссылка на регистрацию -->
                        <div class="text-center">
                            <p class="mb-0">
                                Нет аккаунта?
                                <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">
                                    Зарегистрируйтесь
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
